<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enchanted Stables — Prototype Gallery</title>
  <style>
    :root {
      --color-primary: #4f46e5;
      --color-primary-hover: #4338ca;
      --color-primary-light: #eef2ff;
      --color-text-primary: #111827;
      --color-text-secondary: #6b7280;
      --color-text-muted: #9ca3af;
      --color-bg: #f9fafb;
      --color-surface: #ffffff;
      --color-border: #e5e7eb;
      --color-sidebar: #1e293b;
      --color-sidebar-text: #94a3b8;
      --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / 0.07), 0 1px 2px -1px rgb(0 0 0 / 0.07);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --radius-md: 0.5rem;
      --radius-lg: 0.75rem;
      --radius-xl: 1rem;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: var(--color-bg);
      color: var(--color-text-primary);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 3rem 2rem;
    }

    .header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .header-logo {
      font-size: 2rem;
      font-weight: 700;
      color: var(--color-sidebar);
      margin-bottom: 0.5rem;
    }

    .header-logo span {
      color: var(--color-primary);
    }

    .header-title {
      font-size: 1.875rem;
      font-weight: 700;
      color: var(--color-text-primary);
      margin-bottom: 0.5rem;
    }

    .header-subtitle {
      font-size: 1rem;
      color: var(--color-text-secondary);
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }

    .gallery-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: box-shadow 0.2s, transform 0.2s;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
    }

    .gallery-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-4px);
    }

    .gallery-card-header {
      background: var(--color-primary-light);
      padding: 1.5rem;
      border-bottom: 1px solid var(--color-border);
    }

    .gallery-card-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--color-primary);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.75rem;
      border-radius: var(--radius-md);
      margin-bottom: 0.75rem;
      width: fit-content;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .gallery-card-title {
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--color-text-primary);
    }

    .gallery-card-body {
      padding: 1.5rem;
      flex: 1;
    }

    .gallery-card-description {
      font-size: 0.875rem;
      color: var(--color-text-secondary);
      margin-bottom: 1rem;
      line-height: 1.5;
    }

    .gallery-card-meta {
      font-size: 0.8rem;
      color: var(--color-text-muted);
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .gallery-card-footer {
      padding-top: 1rem;
      border-top: 1px solid var(--color-border);
    }

    .gallery-card-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--color-primary);
      font-weight: 600;
      font-size: 0.875rem;
      text-decoration: none;
      transition: color 0.2s;
    }

    .gallery-card-link:hover {
      color: var(--color-primary-hover);
    }

    .gallery-card-link svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .empty-state {
      text-align: center;
      padding: 3rem 2rem;
      background: var(--color-surface);
      border: 2px dashed var(--color-border);
      border-radius: var(--radius-xl);
    }

    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .empty-state-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--color-text-primary);
      margin-bottom: 0.5rem;
    }

    .empty-state-text {
      color: var(--color-text-secondary);
      margin-bottom: 1.5rem;
    }

    .footer {
      text-align: center;
      padding-top: 2rem;
      border-top: 1px solid var(--color-border);
      font-size: 0.875rem;
      color: var(--color-text-secondary);
    }

    .footer a {
      color: var(--color-primary);
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <div class="header">
    <p class="header-logo">🐴 Enchanted <span>Stables</span></p>
    <h1 class="header-title">Prototype Gallery</h1>
    <p class="header-subtitle">Interactive prototypes for the staff portal — built with Claude</p>
  </div>

  <!-- Gallery -->
  <div class="gallery" id="gallery">
    <!-- Gallery cards will be populated here -->
  </div>

  <!-- Empty state -->
  <div class="empty-state" id="emptyState" style="display: none;">
    <div class="empty-state-icon">📋</div>
    <p class="empty-state-title">No prototypes yet</p>
    <p class="empty-state-text">Prototypes will appear here once they're added to the repository.</p>
  </div>

  <!-- Footer -->
  <div class="footer">
    <p>Built during the Enchanted Stables workshop with <a href="https://claude.ai">Claude</a> • <a href="https://github.com/daria-sorokina-da/claudeworkshop-day_4_demo_fe_prototypes">View on GitHub</a></p>
  </div>
</div>

<script>
  // Define available prototypes
  const PROTOTYPES = [
    {
      id: 'bulk-actions',
      title: 'Bulk Actions Flow',
      category: 'Exercise 4',
      description: 'Select multiple events and perform bulk actions like deactivation with a confirmation dialog and success toast.',
      flow: 'Select mode → Click cards → Floating action bar → Confirm',
      status: 'Complete',
    },
    {
      id: 'schedule',
      title: 'Staff Schedule',
      category: 'Exercise 2',
      description: 'Weekly staff duty roster. View the roster, click staff members to see details, and manage scheduled assignments.',
      flow: 'View roster → Click staff member → See details panel',
      status: 'Complete',
    },
  ];

  function renderGallery() {
    const gallery = document.getElementById('gallery');
    const emptyState = document.getElementById('emptyState');

    if (PROTOTYPES.length === 0) {
      emptyState.style.display = 'block';
      return;
    }

    gallery.innerHTML = PROTOTYPES.map(proto => `
      <a href="./${proto.id}/index.html" class="gallery-card">
        <div class="gallery-card-header">
          <div class="gallery-card-badge">
            <span>✓</span> ${proto.status}
          </div>
          <h3 class="gallery-card-title">${proto.title}</h3>
        </div>
        <div class="gallery-card-body">
          <p class="gallery-card-description">${proto.description}</p>
          <div class="gallery-card-meta">
            <span>📁 ${proto.category}</span>
            <span>🔄 ${proto.flow}</span>
          </div>
        </div>
        <div class="gallery-card-footer">
          <span class="gallery-card-link">
            Open prototype
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </span>
        </div>
      </a>
    `).join('');
  }

  // Render on load
  renderGallery();
</script>

</body>
</html>
