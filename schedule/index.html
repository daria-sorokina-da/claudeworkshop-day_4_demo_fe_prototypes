<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Schedule — Enchanted Stables Portal</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --color-primary:       #4f46e5;
      --color-primary-hover: #4338ca;
      --color-primary-light: #eef2ff;
      --color-text:          #111827;
      --color-text-secondary:#6b7280;
      --color-text-muted:    #9ca3af;
      --color-bg:            #f9fafb;
      --color-surface:       #ffffff;
      --color-border:        #e5e7eb;
      --color-sidebar:       #1e293b;
      --color-sidebar-text:  #94a3b8;
      --radius-sm:  0.375rem;
      --radius-md:  0.5rem;
      --radius-lg:  0.75rem;
      --radius-xl:  1rem;
      --shadow-sm:  0 1px 3px 0 rgb(0 0 0/.07), 0 1px 2px -1px rgb(0 0 0/.07);
      --shadow-md:  0 4px 6px -1px rgb(0 0 0/.1), 0 2px 4px -2px rgb(0 0 0/.1);
      --shadow-lg:  0 10px 15px -3px rgb(0 0 0/.1), 0 4px 6px -4px rgb(0 0 0/.1);
      --sidebar-width: 256px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
      background: var(--color-bg);
      color: var(--color-text);
      display: flex;
      min-height: 100vh;
    }

    /* ── Sidebar ─────────────────────────────────────── */
    .sidebar {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      background: var(--color-sidebar);
      display: flex;
      flex-direction: column;
      padding: 1.5rem 0 1rem;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: hidden;
    }
    .sidebar-logo {
      padding: 0 1.25rem 2rem;
    }
    .sidebar-logo-title {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
      line-height: 1.3;
    }
    .sidebar-logo-subtitle {
      font-size: 0.72rem;
      color: var(--color-sidebar-text);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-top: 2px;
    }
    .sidebar-nav {
      flex: 1;
      padding: 0 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.125rem;
    }
    .nav-link {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      padding: 0.6rem 0.75rem;
      border-radius: var(--radius-md);
      color: var(--color-sidebar-text);
      font-size: 0.875rem;
      font-weight: 500;
      text-decoration: none;
      transition: background 0.15s, color 0.15s;
      cursor: pointer;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
    }
    .nav-link:hover {
      background: rgb(255 255 255/.07);
      color: #fff;
    }
    .nav-link.active {
      background: var(--color-primary);
      color: #fff;
    }
    .nav-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .sidebar-footer {
      margin: 1rem 0.75rem 0;
    }
    .sidebar-menu-btn {
      padding: 0.5rem;
      background: transparent;
      border: 1px solid rgb(255 255 255/.1);
      border-radius: var(--radius-md);
      color: var(--color-sidebar-text);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .sidebar-menu-btn:hover { background: rgb(255 255 255/.07); color: #fff; }

    /* ── Main content ────────────────────────────────── */
    .main {
      flex: 1;
      padding: 2.5rem;
      overflow-y: auto;
      min-width: 0;
    }

    .page-header {
      margin-bottom: 2rem;
    }
    .page-title {
      font-size: 1.625rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: var(--color-text);
    }
    .page-subtitle {
      font-size: 0.9rem;
      color: var(--color-text-secondary);
      margin-top: 0.25rem;
    }

    /* ── Week navigation ─────────────────────────────── */
    .week-nav {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .week-label {
      font-size: 1rem;
      font-weight: 600;
      color: var(--color-text);
      min-width: 200px;
    }
    .btn-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text-secondary);
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      box-shadow: var(--shadow-sm);
    }
    .btn-icon:hover {
      background: var(--color-primary-light);
      color: var(--color-primary);
      border-color: #c7d2fe;
    }
    .btn-today {
      padding: 0.4rem 0.875rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text-secondary);
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      box-shadow: var(--shadow-sm);
    }
    .btn-today:hover {
      background: var(--color-primary-light);
      color: var(--color-primary);
    }

    /* ── Calendar grid ───────────────────────────────── */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.75rem;
    }

    .day-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      padding: 1rem;
      box-shadow: var(--shadow-sm);
      min-height: 180px;
      display: flex;
      flex-direction: column;
      gap: 0.625rem;
      transition: box-shadow 0.18s;
    }
    .day-card:hover { box-shadow: var(--shadow-md); }

    .day-card.today {
      border-color: #c7d2fe;
      background: #fafafe;
    }
    .day-card.today .day-name { color: var(--color-primary); }
    .day-card.today .day-date { color: var(--color-primary); }

    .day-header {
      display: flex;
      flex-direction: column;
      gap: 1px;
      padding-bottom: 0.625rem;
      border-bottom: 1px solid var(--color-border);
    }
    .day-name {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--color-text-secondary);
    }
    .day-date {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--color-text);
      line-height: 1.2;
    }

    .today-badge {
      display: inline-block;
      margin-top: 2px;
      padding: 1px 6px;
      background: var(--color-primary);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      border-radius: 999px;
      text-transform: uppercase;
      width: fit-content;
    }

    .staff-list {
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
      flex: 1;
    }

    .staff-chip {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.625rem;
      border-radius: var(--radius-md);
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--color-text);
      text-align: left;
      width: 100%;
    }
    .staff-chip:hover {
      background: var(--color-primary-light);
      border-color: #c7d2fe;
      color: var(--color-primary);
      transform: translateX(2px);
    }
    .staff-avatar {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      font-weight: 700;
      flex-shrink: 0;
      color: #fff;
    }
    .staff-chip-name {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .staff-chip-role {
      font-size: 0.7rem;
      color: var(--color-text-muted);
      white-space: nowrap;
    }

    .add-staff-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.375rem;
      padding: 0.4rem;
      border-radius: var(--radius-md);
      border: 1px dashed var(--color-border);
      background: transparent;
      color: var(--color-text-muted);
      font-size: 0.75rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      margin-top: auto;
    }
    .add-staff-btn:hover {
      background: var(--color-primary-light);
      border-color: #c7d2fe;
      color: var(--color-primary);
    }

    /* ── Side panel overlay ──────────────────────────── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgb(0 0 0/.25);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .side-panel {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 360px;
      background: var(--color-surface);
      box-shadow: var(--shadow-lg);
      z-index: 101;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .side-panel.open {
      transform: translateX(0);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--color-border);
    }
    .panel-title {
      font-size: 0.975rem;
      font-weight: 600;
      color: var(--color-text);
    }
    .panel-close {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: var(--radius-md);
      border: none;
      background: transparent;
      color: var(--color-text-secondary);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .panel-close:hover { background: var(--color-bg); color: var(--color-text); }

    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .staff-profile {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .staff-avatar-lg {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }
    .staff-profile-info {}
    .staff-profile-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--color-text);
    }
    .staff-profile-role {
      font-size: 0.875rem;
      color: var(--color-text-secondary);
      margin-top: 2px;
    }

    .detail-section {}
    .detail-section-title {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--color-text-secondary);
      margin-bottom: 0.75rem;
    }
    .detail-row {
      display: flex;
      align-items: flex-start;
      gap: 0.625rem;
      padding: 0.625rem 0;
      border-bottom: 1px solid var(--color-border);
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      color: var(--color-text-muted);
      margin-top: 1px;
    }
    .detail-label {
      font-size: 0.8rem;
      color: var(--color-text-muted);
      min-width: 80px;
    }
    .detail-value {
      font-size: 0.875rem;
      color: var(--color-text);
      font-weight: 500;
    }

    .schedule-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.35rem 0.75rem;
      border-radius: var(--radius-sm);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .badge-green  { background: #ecfdf5; color: #065f46; }
    .badge-indigo { background: var(--color-primary-light); color: #3730a3; }
    .badge-amber  { background: #fffbeb; color: #92400e; }

    .stat-row {
      display: flex;
      gap: 0.75rem;
    }
    .mini-stat {
      flex: 1;
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 0.75rem 1rem;
      text-align: center;
    }
    .mini-stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--color-text);
      line-height: 1;
    }
    .mini-stat-label {
      font-size: 0.72rem;
      color: var(--color-text-secondary);
      margin-top: 4px;
    }

    .panel-footer {
      padding: 1.25rem 1.5rem;
      border-top: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      gap: 0.625rem;
    }
    .btn-danger {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.625rem 1rem;
      border-radius: var(--radius-md);
      border: 1px solid #fecaca;
      background: #fef2f2;
      color: #dc2626;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      width: 100%;
    }
    .btn-danger:hover { background: #fee2e2; border-color: #fca5a5; }
    .btn-secondary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.625rem 1rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text-secondary);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
      width: 100%;
    }
    .btn-secondary:hover { background: var(--color-bg); }

    /* ── Notification toast ──────────────────────────── */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: var(--color-text);
      color: #fff;
      padding: 0.75rem 1.25rem;
      border-radius: var(--radius-lg);
      font-size: 0.875rem;
      font-weight: 500;
      box-shadow: var(--shadow-lg);
      z-index: 200;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 900px) {
      .calendar-grid { grid-template-columns: repeat(4, 1fr); }
    }
    @media (max-width: 640px) {
      .sidebar { display: none; }
      .calendar-grid { grid-template-columns: repeat(2, 1fr); }
      .side-panel { width: 100%; }
    }
  </style>
</head>

<!-- ── Main ───────────────────────────────────────────── -->
<main class="main">

  </div>

      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"

<!-- ── Side panel ─────────────────────────────────────── -->

    { id: 6,  name: 'Liam Walsh',       initials: 'LW', role: 'Stable Hand',            email: 'liam.walsh@enchantedstables.com',        joinedAt: '2023-02-14', eventsCount: 18, color: '#ea580c' },
    { id: 7,  name: 'Charlotte Davies', initials: 'CD', role: 'Veterinary Assistant',   email: 'charlotte.davies@enchantedstables.com', joinedAt: '2020-05-30', eventsCount: 34, color: '#0d9488' },
    { id: 8,  name: 'Noah Mitchell',    initials: 'NM', role: 'Farrier',                email: 'noah.mitchell@enchantedstables.com',    joinedAt: '2018-12-01', eventsCount: 61, color: '#b45309' },
    { id: 9,  name: 'Isabella Cooper',  initials: 'IC', role: 'Riding Instructor',      email: 'isabella.cooper@enchantedstables.com',  joinedAt: '2022-08-19', eventsCount: 47, color: '#9333ea' },
    { id: 10, name: 'William Hart',     initials: 'WH', role: 'Feed Manager',           email: 'william.hart@enchantedstables.com',     joinedAt: '2021-06-07', eventsCount: 22, color: '#16a34a' },
  ];

  /* Staff IDs per day (Mon=0 … Sun=6), relative to the "base" week */
  const WEEK_SCHEDULE = [
    [1, 3, 6],    // Mon
    [2, 5],       // Tue
    [4, 7, 10],   // Wed
    [1, 8, 9],    // Thu
    [2, 3, 5],    // Fri
    [6, 10],      // Sat
    [4, 9],       // Sun
  ];

  /* ── State ───────────────────────────────────────────── */
  let offsetWeeks = 0;
  let schedule    = JSON.parse(JSON.stringify(WEEK_SCHEDULE));  // mutable copy
  let activeDay   = null;   // { weekOffset, dayIndex }
  let activeStaff = null;   // staff object

  /* ── Helpers ─────────────────────────────────────────── */
  function getStaff(id) { return STAFF.find(s => s.id === id); }

  function getMondayOfWeek(offset) {
    const today = new Date(2026, 5, 22);  // 22 Jun 2026 — fixed "today" for prototype
    const day   = today.getDay();
    const diff  = (day === 0) ? -6 : 1 - day;
    const mon   = new Date(today);
    mon.setDate(today.getDate() + diff + offset * 7);
    return mon;
  }

  function formatDateShort(d) {
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  }
  function formatDateFull(d) {
    return d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  }
  function isToday(d) {
    const t = new Date(2026, 5, 22);
    return d.getDate() === t.getDate() && d.getMonth() === t.getMonth() && d.getFullYear() === t.getFullYear();
  }

  /* ── Render calendar ─────────────────────────────────── */
  const DAY_NAMES = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  function render() {
    const monday = getMondayOfWeek(offsetWeeks);
    const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
    document.getElementById('weekLabel').textContent =
      formatDateShort(monday) + ' – ' + formatDateShort(sunday) + ' ' + sunday.getFullYear();

    const grid = document.getElementById('calendarGrid');
    grid.innerHTML = '';

    schedule.forEach((dayStaffIds, di) => {
      const date = new Date(monday); date.setDate(monday.getDate() + di);
      const today = isToday(date);

      const card = document.createElement('div');
      card.className = 'day-card' + (today ? ' today' : '');

      const hdr = document.createElement('div');
      hdr.className = 'day-header';
      hdr.innerHTML = `
        <span class="day-name">${DAY_NAMES[di]}</span>
        <span class="day-date">${date.getDate()}</span>
        ${today ? '<span class="today-badge">Today</span>' : ''}
      `;
      card.appendChild(hdr);

      const list = document.createElement('div');
      list.className = 'staff-list';

      dayStaffIds.forEach(sid => {
        const s = getStaff(sid);
        if (!s) return;
        const chip = document.createElement('button');
        chip.className = 'staff-chip';
        chip.setAttribute('data-staff-id', sid);
        chip.setAttribute('data-day-index', di);
        chip.innerHTML = `
          <span class="staff-avatar" style="background:${s.color}">${s.initials}</span>
          <span class="staff-chip-name">${s.name}</span>
        `;
        chip.addEventListener('click', () => openPanel(s, di));
        list.appendChild(chip);
      });

      card.appendChild(list);

      const addBtn = document.createElement('button');
      addBtn.className = 'add-staff-btn';
      addBtn.setAttribute('title', 'Add staff to ' + DAY_NAMES[di]);
      addBtn.innerHTML = `
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Add staff
      `;
      addBtn.addEventListener('click', () => showToast('Add-staff flow not yet implemented'));
      card.appendChild(addBtn);

      grid.appendChild(card);
    });
  }

  /* ── Side panel ──────────────────────────────────────── */
  function openPanel(staff, dayIndex) {
    activeStaff = staff;
    activeDay   = dayIndex;

    document.getElementById('panelTitle').textContent = 'Staff on duty';

    const monday  = getMondayOfWeek(offsetWeeks);
    const date    = new Date(monday); date.setDate(monday.getDate() + dayIndex);
    const dateStr = formatDateFull(date);

    const joined  = new Date(staff.joinedAt).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
    const years   = Math.floor((new Date(2026,5,22) - new Date(staff.joinedAt)) / (365.25 * 24 * 3600 * 1000));

    document.getElementById('panelBody').innerHTML = `
      <div class="staff-profile">
        <div class="staff-avatar-lg" style="background:${staff.color}">${staff.initials}</div>
        <div class="staff-profile-info">
          <div class="staff-profile-name">${staff.name}</div>
          <div class="staff-profile-role">${staff.role}</div>
        </div>
      </div>

      <div class="detail-section">
        <div class="detail-section-title">Scheduled for</div>
        <div class="detail-row">
          <svg class="detail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          <span class="detail-value">${dateStr}</span>
        </div>
        <div class="detail-row" style="padding-top:.625rem">
          <span class="schedule-badge badge-green">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
            On duty
          </span>
        </div>
      </div>

      <div class="detail-section">
        <div class="detail-section-title">Contact</div>
        <div class="detail-row">
          <svg class="detail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <span class="detail-value" style="font-size:.82rem;word-break:break-all">${staff.email}</span>
        </div>
      </div>

      <div class="detail-section">
        <div class="detail-section-title">Staff info</div>
        <div class="detail-row">
          <svg class="detail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
          <span class="detail-label">Joined</span>
          <span class="detail-value">${joined}</span>
        </div>
        <div class="detail-row">
          <svg class="detail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
          </svg>
          <span class="detail-label">Tenure</span>
          <span class="detail-value">${years} year${years !== 1 ? 's' : ''}</span>
        </div>
      </div>

      <div class="stat-row">
        <div class="mini-stat">
          <div class="mini-stat-value">${staff.eventsCount}</div>
          <div class="mini-stat-label">Events attended</div>
        </div>
        <div class="mini-stat">
          <div class="mini-stat-value">${WEEK_SCHEDULE.filter(d => d.includes(staff.id)).length}</div>
          <div class="mini-stat-label">Days this week</div>
        </div>
      </div>
    `;

    document.getElementById('overlay').classList.add('open');
    document.getElementById('sidePanel').classList.add('open');
  }

  function closePanel() {
    document.getElementById('overlay').classList.remove('open');
    document.getElementById('sidePanel').classList.remove('open');
    activeStaff = null;
    activeDay   = null;
  }

  /* ── Remove from schedule ────────────────────────────── */
  document.getElementById('removeBtn').addEventListener('click', () => {
    if (activeStaff === null || activeDay === null) return;
    const name = activeStaff.name;
    const day  = DAY_NAMES[activeDay];
    schedule[activeDay] = schedule[activeDay].filter(id => id !== activeStaff.id);
    closePanel();
    render();
    showToast(`${name} removed from ${day}'s schedule`);
  });

  document.getElementById('viewProfileBtn').addEventListener('click', () => {
    showToast('Full profile view not yet implemented');
  });

  /* ── Week navigation ─────────────────────────────────── */
  document.getElementById('prevWeek').addEventListener('click', () => {
    offsetWeeks--;
    schedule = JSON.parse(JSON.stringify(WEEK_SCHEDULE));
    render();
  });
  document.getElementById('nextWeek').addEventListener('click', () => {
    offsetWeeks++;
    schedule = JSON.parse(JSON.stringify(WEEK_SCHEDULE));
    render();
  });
  document.getElementById('todayBtn').addEventListener('click', () => {
    offsetWeeks = 0;
    schedule = JSON.parse(JSON.stringify(WEEK_SCHEDULE));
    render();
  });

  document.getElementById('overlay').addEventListener('click', closePanel);
  document.getElementById('panelClose').addEventListener('click', closePanel);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });

  /* ── Toast ───────────────────────────────────────────── */
  let toastTimer;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
  }

  /* ── Boot ────────────────────────────────────────────── */
  render();
</script>
</body>
</html>
